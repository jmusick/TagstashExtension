<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tagstash Sidebar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="sidebar.css">
  <script src="lib/theme.js"></script>
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <a href="https://tagsta.sh/" target="_blank" rel="noopener noreferrer" class="sidebar-title-link"><h1>Tagstash</h1></a>
      <div class="sort-toggle" id="sort-toggle" title="Sort tags">
        <button class="sort-btn active" data-sort="count">Count</button>
        <button class="sort-btn" data-sort="alpha">A–Z</button>
      </div>
      <button id="refresh-btn" class="refresh-btn" title="Refresh">↻</button>
    </div>
    <div id="sidebar-search" class="sidebar-search">
      <input id="search-input" type="text" placeholder="Search bookmarks" autocomplete="off" />
      <button id="search-clear" class="search-clear-btn" type="button" title="Clear search" hidden>✕</button>
    </div>
    <p id="not-logged-in" hidden>
      Please sign in via the Tagstash toolbar button first.
    </p>
    <ul id="tags-list"></ul>
  </div>

  <div id="edit-overlay" class="edit-overlay" hidden>
    <div class="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-heading">
      <div class="edit-modal-header">
        <h2 id="edit-modal-heading">Edit Bookmark</h2>
        <button id="edit-close" class="edit-close-btn" type="button" aria-label="Close">✕</button>
      </div>
      <form id="edit-form">
        <div class="edit-field">
          <label for="edit-title">Title</label>
          <input id="edit-title" type="text" required />
        </div>
        <div class="edit-field">
          <label for="edit-url">URL</label>
          <input id="edit-url" type="url" required />
        </div>
        <div class="edit-field">
          <label for="edit-desc">Description</label>
          <textarea id="edit-desc" rows="2"></textarea>
        </div>
        <div class="edit-field">
          <label>Tags</label>
          <div class="edit-tag-shell" id="edit-tags-field">
            <div id="edit-tag-pills" class="edit-tag-pill-list"></div>
            <input id="edit-tags" type="text" placeholder="Type tag, press comma" autocomplete="off" />
          </div>
          <small class="edit-tags-hint">Comma or Space to add &middot; Backspace to remove last</small>
        </div>
        <div id="edit-error" class="edit-error" hidden></div>
        <div class="edit-modal-actions">
          <button type="button" id="edit-cancel" class="edit-cancel-btn">Cancel</button>
          <button type="submit" id="edit-save" class="edit-save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="sidebar.js" type="module"></script>
</body>
</html>
