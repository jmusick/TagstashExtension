<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tagsta.sh Sidebar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Tagsta.sh</h1>
      <div class="sort-toggle" id="sort-toggle" title="Sort tags">
        <button class="sort-btn active" data-sort="count">Count</button>
        <button class="sort-btn" data-sort="alpha">A–Z</button>
      </div>
    </div>
    <p id="not-logged-in" hidden>
      Please sign in via the Tagsta.sh toolbar button first.
    </p>
    <ul id="tags-list"></ul>
  </div>
  <script src="sidebar.js" type="module"></script>
</body>
</html>
