<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tagstash Extension Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="settings-shell">
      <section class="settings-card">
        <p class="eyebrow">Firefox Extension</p>
        <h1>Tagstash Settings</h1>
        <p class="intro">Point the extension at the Tagstash API you want to use. The default local dev server works out of the box.</p>

        <form id="settingsForm" class="settings-form">
          <label>
            <span>API base URL</span>
            <input id="apiBaseUrl" name="apiBaseUrl" type="url" required />
          </label>
          <button id="saveSettingsButton" type="submit">Save settings</button>
        </form>

        <p id="statusMessage" class="status-message" hidden></p>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
