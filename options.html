<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tagstash Extension Settings</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
    <script src="lib/theme.js"></script>
  </head>
  <body>
    <main class="settings-shell">
      <section class="settings-card">
        <span class="brand-lockup"><img src="icons/icon-48.png" width="28" height="28" alt=""><span>Tagstash</span></span>
        <h1>Extension settings</h1>
        <p class="intro">Use the Tagstash API at https://tagsta.sh/api, or enter the URL for your own instance.</p>

        <form id="settingsForm" class="settings-form">
          <label>
            <span>API base URL</span>
            <input id="apiBaseUrl" name="apiBaseUrl" type="url" required />
          </label>
          <button id="saveSettingsButton" type="submit">Save settings</button>
        </form>

        <p id="statusMessage" class="status-message" hidden></p>
      </section>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
